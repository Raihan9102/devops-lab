<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevOps Lab</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color:
                var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        main {
            width: 100%;
            max-width: 520px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 1.6rem;
        }

        p.sub {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: .9rem;
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
        }

        li {
            background: var(--card);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        li span {
            flex: 1;
            cursor: pointer;
        }

        li.done span {
            text-decoration: line-through;
            color: var(--muted);
        }

        li button {
            background: transparent;
            color: var(--danger);
            padding: 4px 8px;
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 24px 0;
        }

        footer {
            margin-top: 24px;
            color: var(--muted);
            font-size: .8rem;
            text-align: center;
        }

        footer a {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <main>
        <h1>DevOps Lab</h1>
        <p class="sub">Todo list kecil untuk latihan Docker, Jenkins, dan Kubernetes.</p>
        <form id="form">
            <input id="title" placeholder="Tugas baru..." autocomplete="off" required>
            <button type="submit">Tambah</button>
        </form>
        <ul id="list"></ul>
        <div id="empty" class="empty" hidden>Belum ada tugas.</div>
        <footer>
            <a href="/health">/health</a> &middot; <a href="/metrics">/metrics</a> &middot; <a
                href="/api/tasks">/api/tasks</a>
        </footer>
    </main>
    <script>
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");
        const form = document.getElementById("form");
        const input = document.getElementById("title");
        async function load() {
            const res = await fetch("/api/tasks");
            const tasks = await res.json();
            list.innerHTML = "";
            empty.hidden = tasks.length > 0;
            for (const t of tasks) {
                const li = document.createElement("li");
                if (t.done) li.className = "done";
                const span = document.createElement("span");
                span.textContent = t.title;
                span.onclick = async () => {
                    await fetch("/api/tasks/" + t.id, { method: "PATCH" });
                    load();
                };
                const del = document.createElement("button");
                del.textContent = "Hapus";
                del.onclick = async () => {
                    await fetch("/api/tasks/" + t.id, { method: "DELETE" });
                    load();
                };
                li.append(span, del);
                list.append(li);
            }
        }
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            await fetch("/api/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: input.value }),
            });
            input.value = "";
            load();
        });
        load();
    </script>
</body>

</html>
