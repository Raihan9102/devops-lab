apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-lab-hpa
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: devops-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-lab-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

