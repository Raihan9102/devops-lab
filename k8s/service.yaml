apiVersion: v1
kind: Service
metadata:
  name: devops-lab-service
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: devops-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: devops-lab
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30080
      protocol: TCP

